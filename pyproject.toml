[project]
name = "unimaas-core-integration-platform"
version = "0.1.0"
description = "FastAPI backend-for-frontend for UniMaaS IC17 Core Integration Platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.8,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
